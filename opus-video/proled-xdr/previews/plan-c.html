<!doctype html><html><head><meta charset="utf-8"><style>
html,body{margin:0;background:#f2efe8;width:1920px;height:1080px;overflow:hidden;font-family:"Inter Display","Inter",sans-serif;color:#111}
.grid{position:absolute;inset:0;background-image:linear-gradient(#0000000d 1px,transparent 1px),linear-gradient(90deg,#0000000d 1px,transparent 1px);background-size:120px 120px}
.idx{position:absolute;left:120px;top:96px;font-size:24px;font-weight:600;letter-spacing:.14em}
.idx span{color:#888}
h1{position:absolute;left:112px;top:300px;margin:0;font-size:168px;font-weight:700;letter-spacing:-.05em;line-height:.92}
p{position:absolute;left:122px;top:680px;margin:0;font-size:36px;font-weight:500;color:#555;width:640px;line-height:1.3}
svg{position:absolute;right:120px;top:120px}
.rule{position:absolute;left:120px;right:120px;top:150px;height:3px;background:#111}
</style></head><body><div class="grid"></div>
<div class="idx">04 / COLOR <span>&nbsp;&nbsp;PROLED XDR DISPLAY</span></div><div class="rule" id="rule"></div>
<h1 id="h">P3 +<br>Adobe RGB.</h1>
<p id="p">Two wide color gamuts, with reference modes for film, photo and design.</p>
<svg width="840" height="840" viewBox="0 0 840 840" id="sv">
 <path id="lock" d="M150 760 C 120 520, 230 160, 330 90 C 420 60, 520 180, 620 300 C 700 400, 760 520, 790 700 Z" fill="#e4dfd4" stroke="#111" stroke-width="3"/>
 <polygon id="adobe" points="290,140 210,700 720,690" fill="#ff5a36" fill-opacity=".18" stroke="#ff5a36" stroke-width="6"/>
 <polygon id="p3" points="330,200 210,700 720,690" fill="#2f5bff" fill-opacity=".14" stroke="#2f5bff" stroke-width="6"/>
 <text x="80" y="130" font-size="28" font-weight="700" fill="#ff5a36">Adobe RGB</text>
 <text x="360" y="330" font-size="28" font-weight="700" fill="#2f5bff">P3</text>
</svg>
<script>
const E=x=>x<0?0:x>1?1:x*x*(3-2*x);
const polys=[adobe,p3];polys.forEach(p=>{const L=p.getTotalLength?2600:2600;p.style.strokeDasharray=L});
window.render=t=>{
 rule.style.transform=`scaleX(${E(t/.8)})`;rule.style.transformOrigin='left';
 h.style.clipPath=`inset(0 ${100-100*E((t-.2)/.7)}% 0 0)`;
 p.style.opacity=E((t-.9)/.5);
 adobe.style.strokeDashoffset=2600*(1-E((t-.4)/1.2));p3.style.strokeDashoffset=2600*(1-E((t-.7)/1.2));
 adobe.setAttribute('fill-opacity',.18*E((t-1.4)/.5));p3.setAttribute('fill-opacity',.14*E((t-1.6)/.5));
 sv.style.transform=`scale(${1+.03*t}) rotate(${-1+.6*t}deg)`;
};
document.fonts.ready.then(()=>{render(0);window.ready=true});
</script></body></html>
