<!doctype html><html><head><meta charset="utf-8"><style>
html,body{margin:0;background:#000;width:1920px;height:1080px;overflow:hidden;font-family:"Inter Display","Inter",sans-serif}
canvas{position:absolute;inset:0}
.cap{position:absolute;left:140px;bottom:150px;color:#fff;font-size:72px;font-weight:600;letter-spacing:-.02em;line-height:1.05}
.cap small{display:block;font-size:28px;font-weight:500;color:#9a9a9a;letter-spacing:.02em;margin-top:18px}
</style></head><body><canvas id="c" width="1920" height="1080"></canvas>
<div class="cap" id="cap">Every pixel,<br>its own light.<small>Tandem OLED · no backlight · no blooming</small></div>
<script>
const c=document.getElementById('c'),g=c.getContext('2d');
const E=x=>x<0?0:x>1?1:x*x*(3-2*x);
function rnd(i){let x=Math.sin(i*127.1+311.7)*43758.5453;return x-Math.floor(x)}
// scene: "image" on the display sampled per pixel = warm sunrise gradient + sun disc
function img(u,v){const d=Math.hypot(u-.62,v-.45);let r=.9-.5*v,gg=.35-.25*v,b=.15+.4*v;if(d<.08){r=1;gg=.85;b=.6}else{const h=Math.max(0,.25-d)*3;r+=h;gg+=h*.6}
 if(v>.62){const f=.12+.2*Math.max(0,.72-v)*10;r*=f;gg*=f*.8;b*=f}return[Math.min(1,r),Math.min(1,gg),Math.min(1,b)]}
window.render=t=>{
 g.fillStyle='#000';g.fillRect(0,0,1920,1080);
 const zoom=60*Math.pow(1/12,E((t-1.6)/3)); // px per display pixel
 const cx=1240,cy=540, gridN=400, fu=.62,fv=.45; // focus near sun
 const cols=Math.ceil(1920/zoom)+2, rows=Math.ceil(1080/zoom)+2;
 const px0=fu*gridN-(cx)/zoom, py0=fv*gridN*0.5625*1-(cy)/zoom;
 const on=E(t/0.8);
 for(let j=0;j<rows;j++)for(let i=0;i<cols;i++){
  const gx=Math.floor(px0)+i, gy=Math.floor(py0)+j;
  const u=gx/gridN, v=gy/(gridN*.5625); if(u<0||u>1||v<0||v>1)continue;
  const sx=(gx-px0)*zoom, sy=(gy-py0)*zoom; const k=rnd(gx*7+gy*13);
  const [r,gg,b]=img(u,v); const L=on*(k<on*1.2?1:0);
  if(zoom>6){const w=zoom/3;[[r,'255,60,40'],[gg,'60,255,90'],[b,'60,110,255']].forEach(([val,col],s)=>{
     g.fillStyle=`rgba(${col},${val*L})`;g.fillRect(sx+s*w+w*.15,sy+zoom*.1,w*.7,zoom*.8);});}
  else{g.fillStyle=`rgb(${r*255*L|0},${gg*255*L|0},${b*255*L|0})`;g.fillRect(sx,sy,zoom+.5,zoom+.5);}
 }
 // glow
 const gr=g.createRadialGradient(cx,cy,0,cx,cy,600);gr.addColorStop(0,`rgba(255,180,120,${.12*on})`);gr.addColorStop(1,'rgba(0,0,0,0)');g.fillStyle=gr;g.fillRect(0,0,1920,1080);
 // vignette for caption
 const lg=g.createLinearGradient(0,0,900,0);lg.addColorStop(0,'rgba(0,0,0,.85)');lg.addColorStop(1,'rgba(0,0,0,0)');g.fillStyle=lg;g.fillRect(0,0,900,1080);
 cap.style.opacity=E((t-1.2)/.6);cap.style.transform=`translateY(${(1-E((t-1.2)/.8))*30}px)`;
};
document.fonts.ready.then(()=>{render(0);window.ready=true});
</script></body></html>
